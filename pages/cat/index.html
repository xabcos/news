<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="旅行猫咪 · 让猫咪带你看见世界">
  <meta name="theme-color" content="#e9dfd0">
  <meta name="referrer" content="no-referrer">
  <title>旅行猫咪 · 𝑪𝒂𝒕</title>
  <link rel="icon" type="image/svg+xml" href="/icon.svg">
  <link rel="stylesheet" href="/cat/cat.css?v=4">
</head>
<body class="cat-page">
  <main class="cat-shell" id="catApp">
    <header class="cat-topbar">
      <a class="cat-back" href="/" aria-label="返回新闻">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m14.5 5-7 7 7 7M8 12h11" /></svg>
        <span>新闻</span>
      </a>
      <div class="cat-wordmark" aria-label="旅行猫咪">
        <span class="cat-wordmark__mark">𝑪𝒂𝒕</span>
        <span class="cat-wordmark__name">旅行猫咪</span>
      </div>
      <div class="cat-top-actions">
        <span class="cat-status-chip" id="catName">小满</span>
        <button class="cat-icon-button cat-inbox-button" id="catInbox" type="button" aria-label="打开猫咪信箱" title="信箱">
          <span aria-hidden="true">✉</span><b id="catUnreadCount" hidden>0</b>
        </button>
        <button class="cat-icon-button" id="catSettings" type="button" aria-label="设置" title="设置">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 8.5a3.5 3.5 0 1 0 0 7 3.5 3.5 0 0 0 0-7Z" /><path d="m19 13.1 1.1.8-1.4 2.4-1.2-.5a7.5 7.5 0 0 1-1.7 1l-.1 1.3h-2.8l-.2-1.3a7.5 7.5 0 0 1-1.7-1l-1.2.5-1.4-2.4 1.1-.8a7 7 0 0 1 0-2.1l-1.1-.8 1.4-2.4 1.2.5a7.5 7.5 0 0 1 1.7-1l.2-1.3h2.8l.1 1.3a7.5 7.5 0 0 1 1.7 1l1.2-.5 1.4 2.4-1.1.8a7 7 0 0 1 0 2.1Z" /></svg>
        </button>
      </div>
    </header>

    <section class="cat-layout" aria-label="旅行猫咪">
      <section class="cat-stage cat-stage--art" aria-label="猫窝">
        <div class="cat-stage__sky" aria-hidden="true">
          <span class="cat-sun"></span>
          <span class="cat-cloud cat-cloud--one"></span>
          <span class="cat-cloud cat-cloud--two"></span>
          <span class="cat-bird cat-bird--one"></span>
          <span class="cat-bird cat-bird--two"></span>
        </div>
        <div class="cat-room" aria-hidden="true">
          <span class="cat-window"><i></i><b></b></span>
          <span class="cat-shelf"><i></i><i></i><i></i></span>
          <span class="cat-plant"><i></i><b></b><em></em></span>
          <span class="cat-rug"></span>
          <span class="cat-suitcase"><i></i><b></b></span>
        </div>
        <div class="cat-companion" id="catCompanion" role="img" aria-label="一只在窗边休息的橘白猫咪">
          <svg class="cat-body-svg" viewBox="0 0 260 260" fill="none" aria-hidden="true">
            <ellipse class="cat-shadow" cx="130" cy="229" rx="62" ry="10" />
            <path class="cat-tail" d="M181 191c40 6 57-19 42-43-8-13-23-14-33-4" />
            <path class="cat-body" d="M82 174c0-47 20-72 49-72s49 25 49 72c0 34-18 47-49 47s-49-13-49-47Z" />
            <path class="cat-chest" d="M110 134c4 17 11 25 21 25s17-8 21-25c-5-13-13-20-21-20s-16 7-21 20Z" />
            <path class="cat-head" d="M82 93c0-35 20-57 48-57s48 22 48 57c0 34-20 52-48 52S82 127 82 93Z" />
            <path class="cat-ear-fill" d="m91 58-5-29c-1-6 5-9 10-6l24 19M169 58l5-29c1-6-5-9-10-6l-24 19" />
            <path class="cat-ear-inner" d="m94 51-3-18 17 14M166 51l3-18-17 14" />
            <ellipse class="cat-eye" cx="111" cy="91" rx="5" ry="7" />
            <ellipse class="cat-eye" cx="149" cy="91" rx="5" ry="7" />
            <path class="cat-marking cat-marking--star" d="m130 52 3.2 7.2 7.8.8-5.8 5.1 1.7 7.6-6.9-3.9-6.9 3.9 1.7-7.6-5.8-5.1 7.8-.8Z" />
            <path class="cat-marking cat-marking--stripe" d="M106 48c7 6 13 8 20 7M154 55c-7 1-13-1-20-7M102 63c8 5 15 6 22 4M158 67c-8 1-15-1-22-4" />
            <path class="cat-marking cat-marking--cloud" d="M113 144c-4-5 1-11 7-9 2-7 13-7 15 0 7-2 11 5 7 9-5 5-24 5-29 0Z" />
            <path class="cat-marking cat-marking--heart" d="m130 126-3-3c-6-6-15 2-9 9l12 11 12-11c6-7-3-15-9-9Z" />
            <path class="cat-face" d="M126 100c-3 3-3 6 0 8 3-2 3-5 0-8ZM118 111c5 5 11 5 16 0M93 104l-24-4M93 113l-25 5M159 104l24-4M159 113l25 5" />
            <path class="cat-paw" d="M91 188c-13 9-17 20-12 29M169 188c13 9 17 20 12 29" />
            <path class="cat-scarf" d="M94 133c19 12 39 12 58 0l-4 30c-17 8-33 8-50 0l-4-30Z" />
            <path class="cat-scarf-tail" d="M146 159c9 11 19 17 31 18" />
            <circle class="cat-accessory-accent cat-accessory--bronze_bell" cx="130" cy="158" r="5" />
            <path class="cat-accessory-accent cat-accessory--canvas_satchel" d="m171 156 18 8-3 31-20-8Z" />
            <path class="cat-accessory-accent cat-accessory--blue_ribbon" d="M112 159c7 7 13 10 18 10s11-3 18-10" />
            <g class="cat-accessory-accent cat-accessory--round_glasses">
              <circle cx="111" cy="91" r="11" /><circle cx="149" cy="91" r="11" /><path d="M122 91h16" />
            </g>
          </svg>
          <span class="cat-thought" id="catThought">今天的风，闻起来像远方。</span>
        </div>
        <div class="cat-stage__caption">
          <span class="cat-weather-dot"></span>
          <span id="catSceneCaption">午后的窗边 · 适合整理行囊</span>
        </div>
      </section>

      <aside class="cat-letter" id="catLetter" aria-label="今日世界来信">
        <div class="cat-letter__stamp">WORLD LETTER · 01</div>
        <div class="cat-letter__heading">
          <div>
            <p class="cat-eyebrow">今日世界来信</p>
            <h1 id="letterTitle">京都的春风捎来一封信</h1>
          </div>
          <span class="cat-letter__pin" aria-hidden="true">✦</span>
        </div>
        <div class="cat-letter__photo" id="letterPhoto" hidden>
          <img alt="" loading="lazy">
        </div>
        <p class="cat-letter__summary" id="letterSummary">猫咪从窗台上抬起头，听见了一个适合出发的季节。</p>
        <div class="cat-letter__source" id="letterSource">旅行灵感 · NEWS 图片新闻</div>
        <div class="cat-letter__actions">
          <button class="cat-button cat-button--primary" id="readButton" type="button">打开这封来信</button>
          <button class="cat-button cat-button--quiet" id="guideButton" type="button">查看猫咪领读</button>
        </div>
      </aside>
    </section>

    <section class="cat-today-panel" id="catTodayPanel" aria-label="今日猫咪生活">
      <div class="cat-panel-heading">
        <div><p class="cat-eyebrow">TODAY · 猫咪正在生活</p><h2 id="catPresenceTitle">猫咪正在窗边休息</h2></div>
        <span class="cat-panel-meta" id="catPresenceMeta">会自己读新闻，也会自己出门</span>
      </div>
      <div class="cat-message-preview" id="catMessagePreview"></div>
      <div class="cat-guide-content" id="catGuideContent" hidden></div>
    </section>

    <section class="cat-content-panel" id="catJournalPanel" hidden aria-labelledby="journalHeading">
      <div class="cat-panel-heading"><div><p class="cat-eyebrow">MEMORY · 旅迹墙</p><h2 id="journalHeading">猫咪日志</h2></div><span class="cat-panel-meta">来信、照片、领读与成长</span></div>
      <div class="cat-filter-row" role="toolbar" aria-label="日志筛选">
        <button class="cat-filter is-active" type="button" data-journal-filter="all" aria-pressed="true">全部</button>
        <button class="cat-filter" type="button" data-journal-filter="postcard" aria-pressed="false">照片</button>
        <button class="cat-filter" type="button" data-journal-filter="guide" aria-pressed="false">领读</button>
        <button class="cat-filter" type="button" data-journal-filter="travel" aria-pressed="false">旅程</button>
        <button class="cat-filter" type="button" data-journal-filter="growth" aria-pressed="false">成长</button>
      </div>
      <div class="cat-journal-grid" id="catJournalGrid"></div>
    </section>

    <section class="cat-content-panel" id="catAtlasPanel" hidden aria-labelledby="atlasHeading">
      <div class="cat-panel-heading"><div><p class="cat-eyebrow">WORLD · 图鉴</p><h2 id="atlasHeading">猫咪认识的世界</h2></div><span class="cat-panel-meta">地点、配饰与记忆</span></div>
      <div class="cat-atlas-grid" id="catAtlasGrid"></div>
    </section>

    <section class="cat-command-bar" aria-label="猫咪互动">
      <button class="cat-command" data-action="feed" type="button"><span class="cat-command__icon">◌</span><span>喂食</span></button>
      <button class="cat-command" data-action="water" type="button"><span class="cat-command__icon">◒</span><span>喝水</span></button>
      <button class="cat-command" data-action="toy" type="button"><span class="cat-command__icon">✧</span><span>玩具</span></button>
    </section>

    <nav class="cat-bottom-nav" aria-label="游戏导航">
      <a class="cat-nav-item is-active" href="#home" aria-current="page"><span aria-hidden="true">⌂</span><small>猫窝</small></a>
      <a class="cat-nav-item" href="#journal"><span aria-hidden="true">▣</span><small>旅迹</small></a>
      <a class="cat-nav-item" href="#atlas"><span aria-hidden="true">◇</span><small>图鉴</small></a>
    </nav>
  </main>

  <div class="cat-toast" id="catToast" role="status" aria-live="polite"></div>
  <dialog class="cat-dialog" id="catDialog">
    <button class="cat-dialog__close" id="dialogClose" type="button" aria-label="关闭">×</button>
    <p class="cat-eyebrow" id="dialogEyebrow">旅行猫咪</p>
    <h2 id="dialogTitle">准备好了吗？</h2>
    <p id="dialogBody">小满正在等你把今天的世界装进行李箱。</p>
    <label class="cat-dialog__field" id="dialogNameField" hidden>
      <span>猫咪名字</span>
      <input id="dialogName" name="name" type="text" maxlength="24" autocomplete="off" value="小满">
    </label>
    <div class="cat-dialog__actions">
      <button class="cat-button cat-button--primary" id="dialogPrimary" type="button">知道了</button>
    </div>
  </dialog>
  <script src="/cat/cat.js?v=3" defer></script>
</body>
</html>
