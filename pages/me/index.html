<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f6f6f4">
  <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0f1115">
  <meta name="referrer" content="no-referrer">
  <title>𝑵𝒆𝒘𝒔 · 工作台</title>
  <link rel="icon" type="image/svg+xml" href="/icon.svg">
  <link rel="stylesheet" href="/styles.css?v=hairline">
  <link rel="stylesheet" href="/me/styles.css?v=llm-v3">
</head>
<body>
  <main class="workspace-shell">
    <section id="authView" class="auth-view hidden" aria-label="邮箱登录">
      <a class="brand brand-hero" href="/" aria-label="𝑵𝒆𝒘𝒔 首页"><img class="brand-logo" src="/icon.svg" alt=""><span>𝑵𝒆𝒘𝒔</span></a>
      <div class="panel auth-panel">
        <form id="loginForm">
          <h1>登录工作台</h1><p class="muted">用邮箱登录，管理你的新闻主题。</p>
          <label for="email">邮箱地址</label>
          <input id="email" name="email" type="email" autocomplete="email" inputmode="email" maxlength="254" placeholder="name@example.com" required>
          <button class="button button-primary button-wide" type="submit">发送登录链接</button>
        </form>
        <div id="mailSent" class="hidden" role="status">
          <h2>请查收邮件</h2><p class="muted">登录链接已发送至 <strong id="sentEmail"></strong>。</p>
          <a id="devLoginLink" class="button button-primary button-wide hidden">打开登录链接</a>
          <button id="sendAgain" class="button button-quiet" type="button">重新输入邮箱</button>
        </div>
        <div id="loginConfirm" class="hidden">
          <h2>确认登录</h2><p class="muted">将以 <strong id="confirmEmail"></strong> 登录工作台。</p>
          <button id="confirmLogin" class="button button-primary button-wide" type="button">继续登录</button>
          <button id="rejectLogin" class="button button-quiet" type="button">不是我的邮箱</button>
        </div>
      </div>
    </section>
    <section id="appView" class="hidden" aria-label="工作台">
      <header class="workspace-topbar">
        <a class="brand" href="/" aria-label="𝑵𝒆𝒘𝒔 首页"><img class="brand-logo" src="/icon.svg" alt=""><span>𝑵𝒆𝒘𝒔</span></a>
        <div class="account-tools">
          <span id="accountEmail" class="account-email muted small"></span>
          <button id="accountButton" class="button button-quiet button-small hidden" type="button">套餐与用量</button>
          <button id="logoutButton" class="button button-quiet button-small" type="button">退出</button>
        </div>
      </header>
      <div class="workspace-heading">
        <div class="workspace-title"><h1 id="workspaceTitle">主题</h1><p id="statusLine" class="muted small" role="status"></p></div>
        <button id="newTopicButton" class="button button-primary" type="button" disabled>＋ 新建主题</button>
      </div>
      <section id="briefingPanel" class="panel briefing-panel hidden" aria-labelledby="briefingTitle">
        <div class="panel-heading">
          <div><h2 id="briefingTitle">XAI 日报</h2><p id="briefingMeta" class="muted small" role="status"></p></div>
          <button id="runBriefingButton" class="button button-primary button-small" type="button">生成日报</button>
        </div>
        <p id="briefingMessage" class="empty-state hidden" role="status"></p>
        <div id="briefingImages" class="briefing-images hidden" aria-label="日报配图"></div>
        <div id="briefingDrafts" class="briefing-drafts hidden">
          <div class="briefing-draft">
            <div class="briefing-draft-heading"><h3>公众号稿</h3><button id="copyWechatButton" class="button button-quiet button-small" type="button">复制</button></div>
            <textarea id="wechatDraft" readonly aria-label="公众号稿"></textarea>
          </div>
          <div class="briefing-draft">
            <div class="briefing-draft-heading"><h3>X Articles 稿</h3><button id="copyXButton" class="button button-quiet button-small" type="button">复制排版稿</button></div>
            <textarea id="xDraft" readonly aria-label="X Articles 稿"></textarea>
          </div>
        </div>
      </section>
      <section id="equityPanel" class="panel briefing-panel hidden" aria-labelledby="equityTitle">
        <div class="panel-heading">
          <div><h2 id="equityTitle"><a href="/?topic=equity-insight" target="_blank" rel="noopener">𝑬 股市观察 ↗</a></h2><p id="equityMeta" class="muted small" role="status"></p></div>
          <button id="runEquityButton" class="button button-primary button-small" type="button">生成研判</button>
        </div>
        <p id="equityMessage" class="empty-state hidden" role="status"></p>
      </section>
      <section class="panel topics-panel" aria-label="主题列表">
        <div class="panel-heading"><h2>主题</h2><button id="refreshButton" class="button button-quiet button-small" type="button">刷新</button></div>
        <p id="topicsMessage" class="empty-state hidden" role="status"></p><ul id="topicList" class="topic-list"></ul>
      </section>
      <section id="contentPanel" class="panel content-panel hidden" aria-labelledby="contentTitle">
        <div class="panel-heading">
          <div><h2 id="contentTitle">最近内容</h2><p id="itemsMeta" class="muted small" role="status"></p></div>
          <div class="inline">
            <div id="dateTools" class="inline hidden"><input id="itemsDay" type="date" aria-label="内容日期"><button id="latestButton" class="button button-quiet button-small" type="button">最近</button></div>
            <button id="refreshItemsButton" class="button button-quiet button-small" type="button">刷新</button>
          </div>
        </div>
        <p id="itemsMessage" class="empty-state" role="status"></p><ul id="itemList" class="item-list"></ul>
        <details id="runsPanel" class="runs-panel hidden">
          <summary>运行记录</summary><p id="runsMessage" class="muted small" role="status"></p>
          <div class="table-wrap" tabindex="0" role="region" aria-label="运行记录表格">
            <table class="runs"><thead><tr><th>时间</th><th>状态</th><th>返回 / 新增 / 重复 / 丢弃</th><th>tokens 入 / 出</th><th>搜索 web / x</th><th>成本</th><th>耗时</th><th>错误</th></tr></thead><tbody id="runsBody"></tbody></table>
          </div>
        </details>
      </section>
    </section>
  </main>
  <dialog id="topicDialog" class="dialog-card topic-dialog" aria-labelledby="topicDialogTitle">
    <form id="topicForm">
      <div class="panel-heading"><h2 id="topicDialogTitle">新建主题</h2><button class="button button-quiet button-small" type="button" data-close-dialog aria-label="关闭">关闭</button></div>
      <div class="field"><label for="topicName">名称</label><input id="topicName" name="name" maxlength="60" placeholder="例如：AI 行业动态" required></div>
      <div class="field"><label for="topicBrief">关注方向</label><textarea id="topicBrief" name="brief" maxlength="2000" rows="4" placeholder="关注的领域、地区、来源偏好或排除项……" required></textarea></div>
      <div class="form-row">
        <div class="field"><label for="topicInterval">抓取间隔（分钟）</label><input id="topicInterval" name="interval_minutes" type="number" min="15" max="1440" step="1" required><p id="intervalHint" class="field-hint muted"></p></div>
        <div class="topic-switches"><label class="switch"><input id="topicEnabled" name="enabled" type="checkbox" checked> 启用抓取</label>
        <label class="switch"><input id="topicVisible" name="visible" type="checkbox" checked> 前台展示</label></div>
      </div>
      <details id="advancedSettings" class="advanced-settings hidden">
        <summary>发布与抓取设置</summary>
        <fieldset id="adminFields" disabled>
          <div class="field-grid">
            <div><label for="topicId">公共 ID</label><input id="topicId" name="id" maxlength="32" pattern="[a-z0-9][a-z0-9-]{0,31}" placeholder="例如 ai，留空自动生成"></div>
            <div><label for="topicNameEn">英文名称</label><input id="topicNameEn" name="name_en" maxlength="60"></div>
          </div>
          <div class="field"><label for="topicDescription">公开说明</label><input id="topicDescription" name="description" maxlength="200" placeholder="显示在新闻首页的一句话"></div>
          <div class="field-grid">
            <div><label for="windowStart">开始时间</label><input id="windowStart" name="window_start_time" type="time" step="60" required></div>
            <div><label for="windowEnd">结束（时）</label><select id="windowEnd" name="window_end"></select></div>
          </div>
          <p id="scheduleTimezone" class="field-hint muted"></p>
          <fieldset class="field"><legend>运行日期</legend><div id="weekdays" class="weekdays"></div></fieldset>
          <div class="field-grid">
            <div><label for="topicModel">模型</label><input id="topicModel" name="model" maxlength="64" placeholder="使用服务默认模型"></div>
            <div><label for="topicEffort">推理强度</label><select id="topicEffort" name="reasoning_effort"><option value="low">low</option><option value="medium">medium</option><option value="high">high</option></select></div>
            <div data-news-only><label for="topicMaxItems">每次最多条数</label><input id="topicMaxItems" name="max_items" type="number" min="1" max="30" required></div>
            <div data-news-only><label for="topicLookback">回看（小时）</label><input id="topicLookback" name="lookback_hours" type="number" min="1" max="72" required></div>
            <div><label for="topicCap">每日运行上限</label><input id="topicCap" name="daily_run_cap" type="number" min="1" max="96" required></div>
            <div><label for="topicSort">排序权重</label><input id="topicSort" name="sort_weight" type="number" required></div>
          </div>
        </fieldset>
      </details>
      <p id="topicFormMessage" class="form-message hidden" role="alert"></p>
      <footer class="dialog-actions">
        <button id="deleteTopicButton" class="button button-quiet danger-text hidden" type="button">删除主题</button>
        <button id="copyUrlButton" class="button button-quiet hidden" type="button">复制公共地址</button>
        <button id="saveTopicButton" class="button button-primary" type="submit">保存主题</button>
      </footer>
    </form>
  </dialog>
  <dialog id="accountDialog" class="dialog-card" aria-labelledby="accountTitle">
    <div class="panel-heading"><h2 id="accountTitle">套餐与用量</h2><button class="button button-quiet button-small" type="button" data-close-dialog>关闭</button></div>
    <div id="accountSummary"></div><div id="planOffer" class="account-section"></div>
    <section id="paymentPanel" class="account-section hidden" aria-label="微信支付"><div id="paymentContent"></div></section>
    <section class="account-section" aria-labelledby="ordersTitle">
      <div class="panel-heading"><h3 id="ordersTitle">最近订单</h3><button id="refreshOrdersButton" class="button button-quiet button-small" type="button">刷新</button></div>
      <p id="ordersMessage" class="muted small" role="status"></p><ul id="ordersList" class="orders-list"></ul>
    </section>
  </dialog>
  <dialog id="confirmDialog" class="dialog-card confirm-dialog" role="alertdialog" aria-labelledby="confirmTitle" aria-describedby="confirmMessage">
    <h2 id="confirmTitle"></h2><p id="confirmMessage" class="muted"></p>
    <div class="dialog-actions"><button class="button button-quiet" type="button" data-close-dialog>取消</button><button id="confirmActionButton" class="button button-danger" type="button">确认删除</button></div>
  </dialog>
  <div id="toastRegion" class="toast-region" aria-live="polite" aria-atomic="true"></div>
  <script src="/me/app.js?v=15" type="module"></script>
</body>
</html>
