# NEWS behind the host nginx. This file only takes effect when the main configuration's
# `http {}` block includes it, e.g. `include /etc/nginx/conf.d/*.conf;` after copying it to
# /etc/nginx/conf.d/xabcnews.com.conf. Remove any older server block for this
# hostname first; install and verification steps are in README.md (部署).
#
# Cloudflare terminates TLS and reaches this host over port 80. The service already answers
# its public routes from memory with a strong ETag and
# `Cache-Control: public, max-age=60, stale-while-revalidate=300`. nginx adds an origin-side
# micro-cache on top of that so
#   - concurrent misses for one URL collapse into a single upstream request,
#   - an expired entry is served at once and refreshed in the background,
#   - the last good copy keeps being served while the container restarts or fails.
# It does not shorten the path between a reader and Cloudflare; the Cloudflare Cache Rule in
# README.md does that.

proxy_cache_path /var/cache/nginx/news levels=1:2 keys_zone=news_cache:10m
                 max_size=256m inactive=1d use_temp_path=off;

upstream news_rust {
    # docker-compose.yml publishes the container on 127.0.0.1:8793 only.
    server 127.0.0.1:8793;
    keepalive 32;
}

server {
    listen 80;
    server_name xabcnews.com;

    # Ordinary API requests remain small.
    client_max_body_size 1m;

    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Sessions, the workspace and payment callbacks go straight through and are never cached.
    location ^~ /api {
        proxy_pass http://news_rust;
        proxy_cache off;
    }

    location ^~ /me {
        proxy_pass http://news_rust;
        proxy_cache off;
    }

    # Public page, JSON, Atom feed and static assets. Freshness comes from the upstream
    # Cache-Control header; nothing without one is cached, and nothing that sets a cookie.
    location / {
        proxy_pass http://news_rust;
        proxy_cache news_cache;
        # Public responses are identical for every visitor: no cookie or header in the key.
        proxy_cache_key $scheme$host$request_uri;
        proxy_cache_lock on;
        proxy_cache_lock_timeout 5s;
        # Expired entries are re-validated with If-None-Match, so a 304 keeps the stored body.
        proxy_cache_revalidate on;
        proxy_cache_background_update on;
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
        # Caching needs buffered responses; the shared http block turns buffering off for
        # the streaming API proxies.
        proxy_buffering on;
        add_header X-Cache-Status $upstream_cache_status always;
    }
}
