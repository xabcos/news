name: Quality Gate

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality-gate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: test
          POSTGRES_DB: news_daily_test_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d news_daily_test_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:test@127.0.0.1:5432/news_daily_test_ci
      NEWS_DAILY_TEST_DATABASE_URL: postgres://postgres:test@127.0.0.1:5432/news_daily_test_ci
      NEWS_PAYMENT_TEST_DATABASE_URL: postgres://postgres:test@127.0.0.1:5432/news_payment_audit_ci
      PUBLIC_BASE_URL: http://127.0.0.1:8788
      NEWS_ADMIN_EMAILS: admin@example.test
      NEWS_SCHEDULER_ENABLED: "false"
      EMAIL_LOGIN_DEV_LINKS: "true"
      TMPFILE_BASE_URL: https://media.example.test
      TMPFILE_API_KEY: test
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: make release-check
      - run: docker exec ${{ job.services.postgres.id }} createdb -U postgres news_payment_audit_ci
      - run: make integration-test
