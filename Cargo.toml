[package]
name = "news"
version = "0.1.0"
edition = "2024"
rust-version = "1.98"

[dependencies]
axum = { version = "0.8", default-features = false, features = ["http1", "json", "query", "tokio"] }
base64 = "0.23"
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.10"
dotenvy = "0.15"
getrandom = "0.4"
hmac = "0.13"
hex = "0.4"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp", "gif"] }
qrcode = { version = "0.14", default-features = false, features = ["svg"] }
pulldown-cmark = { version = "0.13", default-features = false, features = ["html"] }
redis = { version = "1", default-features = false, features = ["tokio-rustls-comp", "connection-manager"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls", "gzip", "multipart"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
scraper = { version = "0.27", default-features = false }
sha2 = { version = "0.11", default-features = false }
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "tls-rustls-aws-lc-rs", "postgres", "chrono", "derive", "json", "migrate", "uuid"] }
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal", "sync", "time"] }
tokio-util = { version = "0.7", features = ["rt"] }
# Keep the same tower-http series as reqwest to avoid duplicate middleware crates.
tower-http = { version = "0.6", default-features = false, features = ["compression-gzip", "fs", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = { version = "2", features = ["serde"] }
uuid = { version = "1", features = ["serde", "v4"] }
zeroize = "1"
feed-rs = { version = "3", default-features = false }

[dev-dependencies]
rcgen = { version = "0.14", default-features = false, features = ["crypto", "aws_lc_rs"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["aws_lc_rs", "tls12"] }

[profile.release]
codegen-units = 1
lto = "fat"
opt-level = 3
panic = "abort"
strip = true

[lints.clippy]
correctness = { level = "deny", priority = -1 }
perf = { level = "deny", priority = -1 }
style = { level = "deny", priority = -1 }
dbg_macro = "deny"
undocumented_unsafe_blocks = "deny"
