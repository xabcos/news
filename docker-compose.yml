services:
  news:
    container_name: news
    image: proxyxai/news:rust
    pull_policy: always
    restart: always
    stop_grace_period: 15s
    depends_on:
      - news-postgres
      - news-redis
    ports:
      - "127.0.0.1:8793:8788"
    environment:
      TZ: Asia/Shanghai
      DATABASE_URL: postgres://postgres:io@news-postgres:5432/news?sslmode=disable
      PUBLIC_BASE_URL: https://xabcnews.com
      NEWS_ADMIN_EMAILS: ${NEWS_ADMIN_EMAILS:-ywgx@xabcloud.com,ywgx@xairouter.com}
      NEWS_TIMEZONE: Asia/Shanghai
      NEWS_BRIEFING_TIME: ${NEWS_BRIEFING_TIME:-06:00}
      NEWS_SCHEDULER_ENABLED: ${NEWS_SCHEDULER_ENABLED:-true}
      NEWS_MAX_CONCURRENT_RUNS: ${NEWS_MAX_CONCURRENT_RUNS:-2}
      NEWS_RETENTION_DAYS: ${NEWS_RETENTION_DAYS:-128}
      NEWS_READS_LICENSES: ${NEWS_READS_LICENSES:-[]}
      REDIS_ADDR: news-redis:6379
      REDIS_DB: 1
      AI_BASE_URL: https://api.zairouter.com
      AI_DEFAULT_MODEL: ${AI_DEFAULT_MODEL:-grok-4.7}
      AI_INSIGHT_MODEL: ${AI_INSIGHT_MODEL:-gpt-6-astra}
      NEWS_FETCH_TIMEOUT_SECS: ${NEWS_FETCH_TIMEOUT_SECS:-1800}
      TMPFILE_BASE_URL: ${TMPFILE_BASE_URL}
      TMPFILE_API_KEY: ${TMPFILE_API_KEY}
      NEWS_IMAGE_MAX_BYTES: ${NEWS_IMAGE_MAX_BYTES:-8388608}
      NEWS_IMAGE_TIMEOUT_SECS: ${NEWS_IMAGE_TIMEOUT_SECS:-30}
      # Leave these empty to disable checkout in local/staging deployments.
      YPAY_BASE_URL: ${YPAY_BASE_URL:-}
      YPAY_TENANT_CODE: ${YPAY_TENANT_CODE:-news}
      YPAY_STORE_API_KEY: ${YPAY_STORE_API_KEY:-}
      YPAY_PAY_METHOD: ${YPAY_PAY_METHOD:-native}
      PAYMENT_WEBHOOK_SECRET: ${PAYMENT_WEBHOOK_SECRET:-}
      # Provided by .env (0600); never written into this file.
      AI_API_KEY: ${AI_API_KEY}
    networks: [network]

  news-mail:
    container_name: news-mail
    image: proxyxai/mail
    pull_policy: always
    restart: always
    stop_grace_period: 45s
    depends_on: [news-redis]
    environment:
      TZ: Asia/Shanghai
      REDIS_ADDR: news-redis:6379
      REDIS_DB: 1
      EMAIL_SMTP: smtp.mx.cloudflare.net
      EMAIL_PORT: 465
      EMAIL_AUTH: api_token
      EMAIL_SENDER: News<noreply@mail.xairouter.com>
      EMAIL_PASS: ${EMAIL_PASS}
    networks: [network]

  news-redis:
    container_name: news-redis
    image: redis:alpine
    pull_policy: always
    restart: always
    command: ["redis-server", "--appendonly", "yes"]
    volumes: [redis_data:/data]
    networks: [network]

  news-postgres:
    container_name: news-postgres
    image: postgres:18
    pull_policy: always
    restart: always
    environment:
      TZ: Asia/Shanghai
      PGTZ: Asia/Shanghai
      POSTGRES_DB: news
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: io
    volumes: [postgres_data:/var/lib/postgresql]
    networks: [network]

volumes:
  postgres_data:
  redis_data:

networks:
  network:
    driver: bridge
