services:
  news:
    container_name: news
    image: proxyxai/news:rust
    pull_policy: always
    restart: always
    stop_grace_period: 15s
    depends_on:
      - news-postgres
      - news-redis
    ports:
      - "127.0.0.1:8793:8788"
    environment:
      TZ: Asia/Shanghai
      DATABASE_URL: postgres://postgres:io@news-postgres:5432/news?sslmode=disable
      PUBLIC_BASE_URL: https://news.xairouter.com
      NEWS_ALLOWED_EMAILS: ywgx@xabcloud.com,ywgx@xairouter.com
      NEWS_TIMEZONE: Asia/Shanghai
      REDIS_ADDR: news-redis:6379
      REDIS_DB: 1
      AI_BASE_URL: https://api.zairouter.com
      # Provided by .env (0600); never written into this file.
      AI_API_KEY: ${AI_API_KEY}
    networks: [network]

  news-mail:
    container_name: news-mail
    image: proxyxai/mail
    pull_policy: always
    restart: always
    depends_on: [news-redis]
    environment:
      TZ: Asia/Shanghai
      REDIS_ADDR: news-redis:6379
      REDIS_DB: 1
      EMAIL_SMTP: smtp.mx.cloudflare.net
      EMAIL_PORT: 465
      EMAIL_AUTH: api_token
      EMAIL_SENDER: News<noreply@mail.xairouter.com>
      EMAIL_PASS: ${EMAIL_PASS}
    networks: [network]

  news-redis:
    container_name: news-redis
    image: redis:alpine
    pull_policy: always
    restart: always
    command: ["redis-server", "--appendonly", "yes"]
    volumes: [redis_data:/data]
    networks: [network]

  news-postgres:
    container_name: news-postgres
    image: postgres:18
    pull_policy: always
    restart: always
    environment:
      TZ: Asia/Shanghai
      PGTZ: Asia/Shanghai
      POSTGRES_DB: news
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: io
    volumes: [postgres_data:/var/lib/postgresql]
    networks: [network]

volumes:
  postgres_data:
  redis_data:

networks:
  network:
    driver: bridge
