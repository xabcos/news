services:
  news:
    build: .
    pull_policy: build
    environment:
      PUBLIC_BASE_URL: http://127.0.0.1:8793/
      NEWS_ADMIN_EMAILS: ${NEWS_ADMIN_EMAILS:-you@example.com}
      EMAIL_LOGIN_DEV_LINKS: "true"
      REDIS_ADDR: ""
      TMPFILE_BASE_URL: ${TMPFILE_BASE_URL:-}
      TMPFILE_API_KEY: ${TMPFILE_API_KEY:-}
  news-mail:
    profiles: [mail]
